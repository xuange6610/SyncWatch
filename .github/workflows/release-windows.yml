name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build and upload (for example v2.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate v-prefixed release tag
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release workflow requires a v-prefixed SemVer tag such as v2.2.0; received '$tag'."
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked package manager
        run: npm install --global pnpm@11.9.0

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare verified Cloudflare Tunnel binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile 'vendor/cloudflared.exe'
          if ((Get-Item 'vendor/cloudflared.exe').Length -lt 1MB) { throw 'Downloaded cloudflared.exe is unexpectedly small.' }

      - name: Verify privacy and release contracts
        shell: pwsh
        run: |
          npm run test:privacy
          node tests/server-package-contract.test.js
          node tests/desktop-release-contract.test.js
          node tests/cloudflared-bundle.test.js

      - name: Download and verify signed Android asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $tag = '${{ inputs.tag || github.ref_name }}'
          gh release download $tag --repo '${{ github.repository }}' --pattern 'SyncWatch-Android-v2.2.0-universal.apk' --dir dist --clobber
          $apk = Get-Item 'dist/SyncWatch-Android-v2.2.0-universal.apk'
          if ($apk.Length -lt 150MB) { throw 'The verified Android asset is unexpectedly small.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $apk.FullName).Hash
          Write-Host "Using signed Android APK $($apk.Length) bytes SHA256 $hash"
          node tests/android-package.test.js $apk.FullName

      - name: Build portable server and client
        shell: pwsh
        run: |
          npx electron-builder --win portable --publish never
          npm run build:client -- --publish never

      - name: Prepare Full offline bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .build/offline-bundle/windows,.build/offline-bundle/android,.build/offline-bundle/mac | Out-Null
          Copy-Item 'dist/SyncWatch-Experience-Client-Portable-v2.2.0-x64.exe' '.build/offline-bundle/windows/SyncWatch-Experience-Client-Portable-v2.2.0-x64.exe' -Force
          Copy-Item 'dist/SyncWatch-Android-v2.2.0-universal.apk' '.build/offline-bundle/android/SyncWatch-Android-v2.2.0-universal.apk' -Force
          gh release download '${{ inputs.tag || github.ref_name }}' --repo '${{ github.repository }}' --pattern 'SyncWatch-Server-macOS-v2.2.0-*.zip' --dir .build/offline-bundle/mac --clobber
          gh release download '${{ inputs.tag || github.ref_name }}' --repo '${{ github.repository }}' --pattern 'SyncWatch-Client-macOS-v2.2.0-*.zip' --dir .build/offline-bundle/mac --clobber
          node scripts/verify-full-offline-bundle.js

      - name: Build Full installer and standalone EXE
        shell: pwsh
        run: |
          npx electron-builder --config electron-builder-windows-installer.json --win nsis --publish never
          npx electron-builder --config electron-builder-windows-full-portable.json --win portable --publish never

      - name: Collect release assets
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | Get-FileHash -Algorithm SHA256

      - name: Verify release tiers and embedded runtime
        shell: pwsh
        run: |
          $expected = @(
            'dist\SyncWatch-v2.2.0-Full-Offline-Installer-x64.exe',
            'dist\SyncWatch-v2.2.0-Full-Offline-Portable-x64.exe',
            'dist\SyncWatch-Standard-Server-Portable-v2.2.0-x64.exe',
            'dist\SyncWatch-Experience-Client-Portable-v2.2.0-x64.exe'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $file" }
            if ((Get-Item -LiteralPath $file).Length -lt 50MB) { throw "Release asset is unexpectedly small: $file" }
            Get-FileHash -Algorithm SHA256 -LiteralPath $file
          }
          if (-not (Test-Path -LiteralPath 'vendor\cloudflared.exe') -or (Get-Item 'vendor\cloudflared.exe').Length -lt 1MB) {
            throw 'The Full and Standard server builds require the bundled cloudflared.exe.'
          }
          $fullPackages = @(
            'dist\SyncWatch-v2.2.0-Full-Offline-Installer-x64.exe',
            'dist\SyncWatch-v2.2.0-Full-Offline-Portable-x64.exe'
          )
          foreach ($file in $fullPackages) {
            if ((Get-Item -LiteralPath $file).Length -lt 1GB) {
              throw "The Full offline package does not contain all platform downloads: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -ge 2GB) {
              throw "The Full offline package exceeds the GitHub Release 2 GiB per-asset limit: $file"
            }
          }
          npm run test:privacy:release

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SyncWatch-Windows-${{ inputs.tag || github.ref_name }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --repo '${{ github.repository }}' --title "SyncWatch同步观影 $tag" --generate-notes }
          gh release upload $tag dist/*.exe --repo '${{ github.repository }}' --clobber
