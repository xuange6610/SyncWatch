name: Build macOS release artifacts

on:
  workflow_call:
    inputs:
      phase:
        description: base or full
        required: true
        type: string
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      source_tree:
        required: true
        type: string
      artifact_prefix:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable macOS build inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate caller inputs
        shell: bash
        env:
          RELEASE_PHASE: ${{ inputs.phase }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_PHASE" =~ ^(base|full)$ ]]
          [[ "$RELEASE_TAG" == "v${RELEASE_VERSION}" ]]
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_TREE" =~ ^[a-f0-9]{40}$ ]]

  base:
    name: Build macOS ${{ matrix.role }} ${{ matrix.arch }}
    if: inputs.phase == 'base'
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: client
            role: Client
            arch: x64
            runner: macos-15-intel
            selection: mac-client-x64
          - kind: client
            role: Client
            arch: arm64
            runner: macos-15
            selection: mac-client-arm64
          - kind: server
            role: Server
            arch: x64
            runner: macos-15-intel
            selection: mac-server-x64
          - kind: server
            role: Server
            arch: arm64
            runner: macos-15
            selection: mac-server-arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit_sha }}
      RELEASE_TREE: ${{ inputs.source_tree }}
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_KIND: ${{ matrix.kind }}
      RELEASE_ROLE: ${{ matrix.role }}
      RELEASE_SELECTION: ${{ matrix.selection }}
    steps:
      - name: Checkout immutable source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify source commit, tree, and native runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$RELEASE_TREE"
          machine="$(uname -m)"
          if [[ "$RELEASE_ARCH" == "x64" ]]; then test "$machine" = "x86_64"; else test "$machine" = "arm64"; fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked package manager
        run: npm install --global pnpm@11.9.0
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare pinned Cloudflare Tunnel binaries
        if: matrix.kind == 'server'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-third-party-assets.js \
            --output vendor \
            --only cloudflared-macos-x64,cloudflared-macos-arm64
      - name: Verify source and desktop contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run test:privacy
          node tests/desktop-release-contract.test.js
          if [[ "$RELEASE_KIND" == "server" ]]; then
            node tests/server-package-contract.test.js
            node tests/cloudflared-bundle.test.js
          fi
      - name: Select matrix architecture for native macOS build
        shell: bash
        env:
          MAC_CONFIG: electron-builder-mac-${{ matrix.kind }}.json
          MAC_SELECTED_CONFIG: .build/electron-builder-mac-${{ matrix.kind }}-${{ matrix.arch }}.json
        run: |
          set -euo pipefail
          mkdir -p .build
          MAC_CONFIG="$MAC_CONFIG" MAC_SELECTED_CONFIG="$MAC_SELECTED_CONFIG" node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync(process.env.MAC_CONFIG, 'utf8'));
          for (const target of config.mac?.target || []) {
            if (target && typeof target === 'object') delete target.arch;
          }
          fs.writeFileSync(process.env.MAC_SELECTED_CONFIG, `${JSON.stringify(config, null, 2)}\n`);
          NODE
      - name: Build native macOS DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --config ".build/electron-builder-mac-${RELEASE_KIND}-${RELEASE_ARCH}.json" --mac --${RELEASE_ARCH} --publish never
      - name: Inspect and launch every macOS base container
        shell: bash
        run: |
          set -euo pipefail

          assert_native_bundle() {
            local app="$1" descriptor candidate found=0
            local bundle_version executable_name executable
            bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
            test "$bundle_version" = "$RELEASE_VERSION"
            executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            executable="$app/Contents/MacOS/$executable_name"
            test -x "$executable"
            while IFS= read -r -d '' candidate; do
              descriptor="$(file "$candidate")"
              [[ "$descriptor" == *"Mach-O"* ]] || continue
              found=1
              if [[ "$RELEASE_ARCH" == "x64" ]]; then
                [[ "$descriptor" == *"x86_64"* && "$descriptor" != *"arm64"* ]]
              else
                [[ "$descriptor" == *"arm64"* && "$descriptor" != *"x86_64"* ]]
              fi
            done < <(find "$app/Contents/MacOS" "$app/Contents/Frameworks" -type f -print0)
            test "$found" -eq 1
            if [[ -e "$app/Contents/Resources/vendor/cloudflared-darwin-x64" ]]; then
              file "$app/Contents/Resources/vendor/cloudflared-darwin-x64" | grep -q 'x86_64'
              file "$app/Contents/Resources/vendor/cloudflared-darwin-arm64" | grep -q 'arm64'
            fi
            printf '%s\n' "$executable"
          }

          smoke_client() {
            local executable="$1" profile log pid
            profile="$(mktemp -d "$RUNNER_TEMP/syncwatch-client.XXXXXX")"
            log="$profile/client.log"
            "$executable" --user-data-dir="$profile/profile" >"$log" 2>&1 &
            pid=$!
            sleep 15
            if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; return 1; fi
            kill "$pid"
            wait "$pid" || true
            rm -rf "$profile"
          }

          smoke_server() {
            local executable="$1" profile log port pid response="" attempt
            profile="$(mktemp -d "$RUNNER_TEMP/syncwatch-server.XXXXXX")"
            log="$profile/server.log"
            port="$(node -e "const s=require('net').createServer();s.listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")"
            PORT="$port" SYNCWATCH_DATA_DIR="$profile/data" SYNCWATCH_SMOKE_MODE=1 SYNCWATCH_SMOKE_EXIT_MS=120000 \
              "$executable" --user-data-dir="$profile/profile" >"$log" 2>&1 &
            pid=$!
            for attempt in $(seq 1 180); do
              if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; return 1; fi
              if response="$(curl -fsS "http://127.0.0.1:${port}/api/public-config" 2>/dev/null)"; then break; fi
              sleep 0.5
            done
            test -n "$response"
            CONFIG_JSON="$response" node -e 'const c=JSON.parse(process.env.CONFIG_JSON);if(c.version!==`v${process.env.RELEASE_VERSION}`)process.exit(1)'
            kill "$pid"
            wait "$pid" || true
            rm -rf "$profile"
          }

          verify_container() {
            local archive="$1" format="$2" root app executable
            root="$(mktemp -d "$RUNNER_TEMP/syncwatch-container.XXXXXX")"
            if [[ "$format" == "zip" ]]; then
              ditto -x -k "$archive" "$root"
            else
              hdiutil attach "$archive" -nobrowse -readonly -mountpoint "$root" >/dev/null
            fi
            app="$(find "$root" -maxdepth 2 -type d -name '*.app' -print -quit)"
            test -n "$app"
            executable="$(assert_native_bundle "$app")"
            if [[ "$RELEASE_KIND" == "client" ]]; then smoke_client "$executable"; else smoke_server "$executable"; fi
            if [[ "$format" == "dmg" ]]; then hdiutil detach "$root" >/dev/null; fi
            rm -rf "$root"
          }

          dmg="dist/SyncWatch-${RELEASE_ROLE}-macOS-v${RELEASE_VERSION}-${RELEASE_ARCH}.dmg"
          zip="dist/SyncWatch-${RELEASE_ROLE}-macOS-v${RELEASE_VERSION}-${RELEASE_ARCH}.zip"
          test -s "$dmg"
          test -s "$zip"
          old_ascii="tang""jingxuan"
          old_name="唐""靖轩"
          ! LC_ALL=C grep -aEqi "${old_ascii}|${old_name}" "$dmg"
          ! LC_ALL=C grep -aEqi "${old_ascii}|${old_name}" "$zip"
          verify_container "$zip" zip
          verify_container "$dmg" dmg
          rm -f dist/*.blockmap dist/latest*.yml dist/builder-debug.yml
          node scripts/release-candidate-gate.js \
            --selection "$RELEASE_SELECTION" \
            --version "$RELEASE_VERSION" \
            --directory dist \
            --evidence ".build/evidence/${RELEASE_SELECTION}.json" \
            --source-commit "$RELEASE_COMMIT" \
            --source-tree "$RELEASE_TREE" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          npm run test:privacy:release
      - name: Upload native macOS base artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-mac-base-${{ matrix.kind }}-${{ matrix.arch }}
          path: |
            dist/SyncWatch-${{ matrix.role }}-macOS-v${{ inputs.version }}-${{ matrix.arch }}.dmg
            dist/SyncWatch-${{ matrix.role }}-macOS-v${{ inputs.version }}-${{ matrix.arch }}.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload native macOS base evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-evidence-mac-base-${{ matrix.kind }}-${{ matrix.arch }}
          path: .build/evidence/${{ matrix.selection }}.json
          if-no-files-found: error
          retention-days: 3

  full:
    name: Build macOS Full Offline ${{ matrix.arch }}
    if: inputs.phase == 'full'
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            selection: mac-full-x64
          - arch: arm64
            runner: macos-15
            selection: mac-full-arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit_sha }}
      RELEASE_TREE: ${{ inputs.source_tree }}
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_SELECTION: ${{ matrix.selection }}
    steps:
      - name: Checkout immutable source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify source commit, tree, and native runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$RELEASE_TREE"
          machine="$(uname -m)"
          if [[ "$RELEASE_ARCH" == "x64" ]]; then test "$machine" = "x86_64"; else test "$machine" = "arm64"; fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked package manager
        run: npm install --global pnpm@11.9.0
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare pinned Cloudflare Tunnel binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-third-party-assets.js \
            --output vendor \
            --only cloudflared-macos-x64,cloudflared-macos-arm64
      - name: Download same-run Windows base artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-windows-base
          path: .build/offline-bundle/windows
      - name: Download same-run Android artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-android
          path: .build/offline-bundle/android
      - name: Download same-run macOS base artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact_prefix }}-mac-base-*
          path: .build/offline-bundle/mac
          merge-multiple: true
      - name: Verify Full Offline inputs and source contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-full-offline-bundle.js
          npm run test:privacy
          node tests/server-package-contract.test.js
          node tests/desktop-release-contract.test.js
          node tests/cloudflared-bundle.test.js
      - name: Build native macOS Full Offline DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --config electron-builder-mac-full.json --mac --${RELEASE_ARCH} --publish never
      - name: Inspect and launch every macOS Full Offline container
        shell: bash
        run: |
          set -euo pipefail

          assert_native_bundle() {
            local app="$1" descriptor candidate found=0
            local bundle_version executable_name executable
            bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
            test "$bundle_version" = "$RELEASE_VERSION"
            executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            executable="$app/Contents/MacOS/$executable_name"
            test -x "$executable"
            while IFS= read -r -d '' candidate; do
              descriptor="$(file "$candidate")"
              [[ "$descriptor" == *"Mach-O"* ]] || continue
              found=1
              if [[ "$RELEASE_ARCH" == "x64" ]]; then
                [[ "$descriptor" == *"x86_64"* && "$descriptor" != *"arm64"* ]]
              else
                [[ "$descriptor" == *"arm64"* && "$descriptor" != *"x86_64"* ]]
              fi
            done < <(find "$app/Contents/MacOS" "$app/Contents/Frameworks" -type f -print0)
            test "$found" -eq 1
            file "$app/Contents/Resources/vendor/cloudflared-darwin-x64" | grep -q 'x86_64'
            file "$app/Contents/Resources/vendor/cloudflared-darwin-arm64" | grep -q 'arm64'
            printf '%s\n' "$executable"
          }

          smoke_full_server() {
            local executable="$1" profile log port pid response="" attempt
            profile="$(mktemp -d "$RUNNER_TEMP/syncwatch-full.XXXXXX")"
            log="$profile/server.log"
            port="$(node -e "const s=require('net').createServer();s.listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")"
            PORT="$port" SYNCWATCH_DATA_DIR="$profile/data" SYNCWATCH_SMOKE_MODE=1 SYNCWATCH_SMOKE_EXIT_MS=120000 \
              "$executable" --user-data-dir="$profile/profile" >"$log" 2>&1 &
            pid=$!
            for attempt in $(seq 1 180); do
              if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; return 1; fi
              if response="$(curl -fsS "http://127.0.0.1:${port}/api/public-config" 2>/dev/null)"; then break; fi
              sleep 0.5
            done
            test -n "$response"
            CONFIG_JSON="$response" node -e '
              const c=JSON.parse(process.env.CONFIG_JSON);
              const ok=c.version===`v${process.env.RELEASE_VERSION}`
                && c.androidApkAvailable===true
                && c.clientDownloadAvailable===true
                && Array.isArray(c.macServerDownloads) && c.macServerDownloads.length===2
                && Array.isArray(c.macClientDownloads) && c.macClientDownloads.length===2;
              if(!ok)process.exit(1);
            '
            kill "$pid"
            wait "$pid" || true
            rm -rf "$profile"
          }

          verify_container() {
            local archive="$1" format="$2" root app executable
            root="$(mktemp -d "$RUNNER_TEMP/syncwatch-container.XXXXXX")"
            if [[ "$format" == "zip" ]]; then
              ditto -x -k "$archive" "$root"
            else
              hdiutil attach "$archive" -nobrowse -readonly -mountpoint "$root" >/dev/null
            fi
            app="$(find "$root" -maxdepth 2 -type d -name '*.app' -print -quit)"
            test -n "$app"
            executable="$(assert_native_bundle "$app")"
            smoke_full_server "$executable"
            if [[ "$format" == "dmg" ]]; then hdiutil detach "$root" >/dev/null; fi
            rm -rf "$root"
          }

          dmg="dist/SyncWatch-Full-Offline-macOS-v${RELEASE_VERSION}-${RELEASE_ARCH}.dmg"
          zip="dist/SyncWatch-Full-Offline-macOS-v${RELEASE_VERSION}-${RELEASE_ARCH}.zip"
          test -s "$dmg"
          test -s "$zip"
          old_ascii="tang""jingxuan"
          old_name="唐""靖轩"
          ! LC_ALL=C grep -aEqi "${old_ascii}|${old_name}" "$dmg"
          ! LC_ALL=C grep -aEqi "${old_ascii}|${old_name}" "$zip"
          verify_container "$zip" zip
          verify_container "$dmg" dmg
          rm -f dist/*.blockmap dist/latest*.yml dist/builder-debug.yml
          node scripts/release-candidate-gate.js \
            --selection "$RELEASE_SELECTION" \
            --version "$RELEASE_VERSION" \
            --directory dist \
            --evidence ".build/evidence/${RELEASE_SELECTION}.json" \
            --source-commit "$RELEASE_COMMIT" \
            --source-tree "$RELEASE_TREE" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          npm run test:privacy:release
      - name: Upload native macOS Full Offline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-mac-full-${{ matrix.arch }}
          path: |
            dist/SyncWatch-Full-Offline-macOS-v${{ inputs.version }}-${{ matrix.arch }}.dmg
            dist/SyncWatch-Full-Offline-macOS-v${{ inputs.version }}-${{ matrix.arch }}.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload native macOS Full Offline evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-evidence-mac-full-${{ matrix.arch }}
          path: .build/evidence/${{ matrix.selection }}.json
          if-no-files-found: error
          retention-days: 3
