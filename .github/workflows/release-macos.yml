name: Build macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag (for example v2.2.0)
        required: true
        default: v2.2.0

permissions:
  contents: write

concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS ${{ matrix.kind }} x64 + arm64
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [client, server]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VERSION: "2.2.0"
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate v-prefixed release tag
        run: |
          tag='${{ inputs.tag }}'
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release workflow requires a v-prefixed SemVer tag such as v2.2.0; received '$tag'" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked package manager
        run: npm install --global pnpm@11.9.0

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare verified Cloudflare Tunnel binaries
        if: matrix.kind == 'server'
        run: |
          mkdir -p vendor
          curl -fL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz | tar -xz -C vendor
          mv vendor/cloudflared vendor/cloudflared-darwin-x64
          curl -fL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz -C vendor
          mv vendor/cloudflared vendor/cloudflared-darwin-arm64
          chmod 755 vendor/cloudflared-darwin-x64 vendor/cloudflared-darwin-arm64
          test "$(stat -f %z vendor/cloudflared-darwin-x64)" -gt 1000000
          test "$(stat -f %z vendor/cloudflared-darwin-arm64)" -gt 1000000

      - name: Build DMG and ZIP
        run: |
          npx electron-builder \
            --config electron-builder-mac-${{ matrix.kind }}.json \
            --mac \
            --publish never

      - name: Verify package names, size and privacy
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.kind }}" == "client" ]]; then
            release_role="Client"
          else
            release_role="Server"
          fi
          old_ascii="tang""jingxuan"
          old_name="唐""靖轩"
          for arch in x64 arm64; do
            dmg="dist/SyncWatch-${release_role}-macOS-v${VERSION}-${arch}.dmg"
            zip="dist/SyncWatch-${release_role}-macOS-v${VERSION}-${arch}.zip"
            test -s "$dmg"
            test -s "$zip"
            ! grep -aEqi "${old_ascii}|${old_name}" "$dmg"
            ! grep -aEqi "${old_ascii}|${old_name}" "$zip"
            shasum -a 256 "$dmg" "$zip"
          done

      - name: Upload packages to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ matrix.kind }}" == "client" ]]; then
            release_role="Client"
          else
            release_role="Server"
          fi

          gh release upload "${{ inputs.tag }}" \
            "dist/SyncWatch-${release_role}-macOS-v${VERSION}-x64.dmg" \
            "dist/SyncWatch-${release_role}-macOS-v${VERSION}-x64.zip" \
            "dist/SyncWatch-${release_role}-macOS-v${VERSION}-arm64.dmg" \
            "dist/SyncWatch-${release_role}-macOS-v${VERSION}-arm64.zip" \
            --clobber

  full:
    name: macOS Full Offline ${{ matrix.arch }}
    needs: build
    runs-on: macos-14
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VERSION: "2.2.0"
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate v-prefixed release tag
        run: |
          tag='${{ inputs.tag }}'
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release workflow requires a v-prefixed SemVer tag such as v2.2.0; received '$tag'" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked package manager
        run: npm install --global pnpm@11.9.0

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Download platform runtimes and offline downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor .build/offline-bundle/{windows,android,mac}

          curl -fL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz | tar -xz -C vendor
          mv vendor/cloudflared vendor/cloudflared-darwin-x64
          curl -fL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz -C vendor
          mv vendor/cloudflared vendor/cloudflared-darwin-arm64
          chmod 755 vendor/cloudflared-darwin-x64 vendor/cloudflared-darwin-arm64

          gh release download "${{ inputs.tag }}" --pattern 'SyncWatch-Experience-Client-Portable-v2.2.0-x64.exe' --dir .build/offline-bundle/windows --clobber

          gh release download "${{ inputs.tag }}" --pattern 'SyncWatch-Android-v2.2.0-universal.apk' --dir .build/offline-bundle/android --clobber

          gh release download "${{ inputs.tag }}" --pattern 'SyncWatch-Server-macOS-v2.2.0-*.zip' --dir .build/offline-bundle/mac --clobber
          gh release download "${{ inputs.tag }}" --pattern 'SyncWatch-Client-macOS-v2.2.0-*.zip' --dir .build/offline-bundle/mac --clobber
          node scripts/verify-full-offline-bundle.js

      - name: Build Full Offline DMG and ZIP
        shell: bash
        run: |
          npx electron-builder \
            --config electron-builder-mac-full.json \
            --mac \
            --${{ matrix.arch }} \
            --publish never

      - name: Verify and collect Full Offline packages
        shell: bash
        run: |
          set -euo pipefail
          old_ascii="tang""jingxuan"
          old_name="唐""靖轩"
          for extension in dmg zip; do
            source="dist/SyncWatch-Full-Offline-macOS-v${VERSION}-${{ matrix.arch }}.${extension}"
            test -s "$source"
            size="$(stat -f %z "$source")"
            test "$size" -ge 1073741824
            test "$size" -lt 2147483648
            ! grep -aEqi "${old_ascii}|${old_name}" "$source"
            shasum -a 256 "$source"
          done

      - name: Upload Full Offline packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            files=(
              "dist/SyncWatch-Full-Offline-macOS-v${VERSION}-x64.dmg"
              "dist/SyncWatch-Full-Offline-macOS-v${VERSION}-x64.zip"
            )
          else
            files=(
              "dist/SyncWatch-Full-Offline-macOS-v${VERSION}-arm64.dmg"
              "dist/SyncWatch-Full-Offline-macOS-v${VERSION}-arm64.zip"
            )
          fi
          gh release upload "${{ inputs.tag }}" "${files[@]}" --clobber
