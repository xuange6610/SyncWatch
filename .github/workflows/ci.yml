name: Contribution checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribution-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository standards
        run: npm run test:repo

      - name: Run core integration tests
        run: npm test

      - name: Verify credential and UI copy contracts
        run: npm run test:credential-policy && npm run test:ui-copy

      - name: Verify atomic release gates
        run: npm run test:release-gates
