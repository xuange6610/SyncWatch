name: Build, verify, and publish one atomic release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated v-prefixed tag; dispatch this workflow from the same tag ref
        required: true
        type: string
      node_mobile_runtime_run_id:
        description: Optional prior Actions run containing a verified pinned Node.js Mobile runtime
        required: false
        default: ''
        type: string
      node_mobile_runtime_artifact_name:
        description: Artifact name in node_mobile_runtime_run_id; required when the run id is set
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: atomic-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Lock release source identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      source_tree: ${{ steps.source.outputs.source_tree }}
      artifact_prefix: ${{ steps.source.outputs.artifact_prefix }}
    steps:
      - name: Checkout the requested tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify annotated tag, commit, tree, version, and Release target
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          NODE_MOBILE_RUNTIME_RUN_ID: ${{ inputs.node_mobile_runtime_run_id }}
          NODE_MOBILE_RUNTIME_ARTIFACT_NAME: ${{ inputs.node_mobile_runtime_artifact_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ -n "$NODE_MOBILE_RUNTIME_RUN_ID" || -n "$NODE_MOBILE_RUNTIME_ARTIFACT_NAME" ]]; then
            [[ "$NODE_MOBILE_RUNTIME_RUN_ID" =~ ^[0-9]+$ ]]
            [[ "$NODE_MOBILE_RUNTIME_ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          fi
          test "$WORKFLOW_REF" = "refs/tags/${RELEASE_TAG}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = "tag"
          commit_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          source_tree="$(git rev-parse "${RELEASE_TAG}^{tree}")"
          test "$WORKFLOW_SHA" = "$commit_sha"
          test "$(git rev-parse HEAD)" = "$commit_sha"
          test "$(git rev-parse 'HEAD^{tree}')" = "$source_tree"
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v${version}"
          test -s "docs/release-notes-v${version}.md"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > .release-targets.json
          RELEASES_JSON=.release-targets.json node -e '
            const releases=require(`./${process.env.RELEASES_JSON}`);
            const matches=releases.filter((release)=>release.tag_name===process.env.RELEASE_TAG);
            if(matches.length>1)throw new Error(`Multiple Releases target ${process.env.RELEASE_TAG}.`);
            if(matches.length===1) {
              const release=matches[0];
              if(!Array.isArray(release.assets) || ![0,6,8,10,11,26].includes(release.assets.length)) {
                throw new Error(`The existing Release must contain zero, partial legacy, or current 8 assets.`);
              }
              if(release.assets.length===0 && release.draft!==true) {
                throw new Error(`An empty existing Release must remain a draft.`);
              }
            }
          '
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=release-${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  source_tests:
    name: Run source and repository release gates
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # GitHub-hosted Ubuntu runners do not preserve Electron's chrome-sandbox
    # SUID bit after npm ci. The release gate still exercises the Electron
    # flows, while this CI-only setting avoids a runner-specific SIGTRAP.
    env:
      ELECTRON_DISABLE_SANDBOX: '1'
      # Linux smoke mode intentionally has no cloudflared tunnel manager;
      # the real public-tunnel flow is exercised on supported desktop runners.
      SYNCWATCH_SKIP_PUBLIC_TUNNEL_SMOKE: '1'
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
      - name: Verify immutable checkout
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
          RELEASE_TREE: ${{ needs.prepare.outputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$RELEASE_TREE"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare pinned Cloudflare binary for source smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-third-party-assets.js \
            --output .build/source-cloudflared \
            --only cloudflared-windows-x64.exe
          mkdir -p vendor
          cp .build/source-cloudflared/cloudflared-windows-x64.exe vendor/cloudflared.exe
      - name: Run release-specific source gates
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/release-candidate-gate.js
          node --check scripts/release-third-party-assets.js
          node tests/release-candidate-gate.test.js
          node tests/release-third-party-assets.test.js
          node tests/release-atomic-workflow.test.js
          npm run test:repo
          xvfb-run -a npm run test:all

  android:
    name: Build and verify Android
    needs: [prepare, source_tests]
    uses: ./.github/workflows/release-windows.yml
    with:
      phase: android
      tag: ${{ inputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}
      source_tree: ${{ needs.prepare.outputs.source_tree }}
      artifact_prefix: ${{ needs.prepare.outputs.artifact_prefix }}
      node_mobile_runtime_run_id: ${{ inputs.node_mobile_runtime_run_id }}
      node_mobile_runtime_artifact_name: ${{ inputs.node_mobile_runtime_artifact_name }}
    secrets:
      android_keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      android_key_properties_base64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}

  windows_base:
    name: Build and verify Windows base packages
    needs: [prepare, source_tests, official_assets]
    uses: ./.github/workflows/release-windows.yml
    with:
      phase: base
      tag: ${{ inputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}
      source_tree: ${{ needs.prepare.outputs.source_tree }}
      artifact_prefix: ${{ needs.prepare.outputs.artifact_prefix }}

  official_assets:
    name: Download and verify pinned official runtimes
    needs: [prepare, source_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
      - name: Verify immutable checkout
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
          RELEASE_TREE: ${{ needs.prepare.outputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$RELEASE_TREE"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked production dependencies for proxy-aware downloads
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Restore verified third-party release cache
        uses: actions/cache@v4
        with:
          path: .cache/release-third-party
          key: syncwatch-third-party-${{ hashFiles('scripts/release-third-party-assets.js') }}
          restore-keys: |
            syncwatch-third-party-
      - name: Download fixed upstream files directly into dist
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
          RELEASE_TREE: ${{ needs.prepare.outputs.source_tree }}
        run: |
          set -euo pipefail
          test ! -e dist
          node scripts/release-third-party-assets.js \
            --output dist \
            --cache-directory .cache/release-third-party \
            --evidence .build/evidence/official.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          node scripts/release-candidate-gate.js \
            --selection official \
            --version "$RELEASE_VERSION" \
            --directory dist
          file dist/*
      - name: Upload fixed official assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-official
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload official source evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-evidence-official
          path: .build/evidence/official.json
          if-no-files-found: error
          retention-days: 3

  windows_full:
    name: Build and verify Windows Full Offline packages
    needs: [prepare, android, windows_base, official_assets]
    uses: ./.github/workflows/release-windows.yml
    with:
      phase: full
      tag: ${{ inputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}
      source_tree: ${{ needs.prepare.outputs.source_tree }}
      artifact_prefix: ${{ needs.prepare.outputs.artifact_prefix }}

  final:
    name: Verify exact 10 files and publish atomically
    needs: [prepare, source_tests, android, windows_base, official_assets, windows_full]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Prepare the only final dist directory
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
          RELEASE_TREE: ${{ needs.prepare.outputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$RELEASE_TREE"
          test ! -e dist
          mkdir dist
      - name: Download same-run Android artifact into dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-android
          path: dist
      - name: Download same-run Windows base artifacts into dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-windows-base
          path: dist
      - name: Download same-run Windows Full Offline artifacts into dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-windows-full
          path: dist
      - name: Download same-run official assets into dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-official
          path: dist
      - name: Download all same-run provenance evidence
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.prepare.outputs.artifact_prefix }}-evidence-*
          path: .build/evidence
          merge-multiple: true
      - name: Generate source archives directly in dist and verify exact 10
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
          RELEASE_TREE: ${{ needs.prepare.outputs.source_tree }}
        run: |
          set -euo pipefail
          git archive \
            --format=zip \
            --prefix="SyncWatch-v${RELEASE_VERSION}/" \
            --output="dist/SyncWatch-Source-v${RELEASE_VERSION}.zip" \
            "$RELEASE_COMMIT"
          git archive \
            --format=tar \
            --prefix="SyncWatch-v${RELEASE_VERSION}/" \
            "$RELEASE_COMMIT" \
            | gzip -9 -n > "dist/SyncWatch-Source-v${RELEASE_VERSION}.tar.gz"
          node scripts/release-candidate-gate.js \
            --selection bundle \
            --version "$RELEASE_VERSION" \
            --directory dist \
            --manifest .build/SHA256SUMS-all-10.txt \
            --upload-manifest .build/SHA256SUMS-release-8.txt \
            --release-list .build/release-files-8.txt \
            --evidence-directory .build/evidence \
            --source-commit "$RELEASE_COMMIT" \
            --source-tree "$RELEASE_TREE" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "10"
          test "$(wc -l < .build/SHA256SUMS-all-10.txt | tr -d ' ')" = "10"
          test "$(wc -l < .build/SHA256SUMS-release-8.txt | tr -d ' ')" = "8"
          test "$(wc -l < .build/release-files-8.txt | tr -d ' ')" = "8"
      - name: Preserve final hashes and provenance as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-final-audit
          path: |
            .build/SHA256SUMS-all-10.txt
            .build/SHA256SUMS-release-8.txt
            .build/release-files-8.txt
            .build/evidence/*.json
            dist/SyncWatch-Source-v${{ needs.prepare.outputs.version }}.zip
            dist/SyncWatch-Source-v${{ needs.prepare.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Upload one complete set, verify remote digests, then publish Latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
          RELEASE_TREE: ${{ needs.prepare.outputs.source_tree }}
          NOTES_FILE: docs/release-notes-v${{ needs.prepare.outputs.version }}.md
        run: |
          set -euo pipefail
          mapfile -t files < .build/release-files-8.txt
          mapfile -t asset_names < <(sed 's#^dist/##' .build/release-files-8.txt)
          test "${#files[@]}" -eq 8
          test "${#asset_names[@]}" -eq 8
          for file in "${files[@]}"; do test -s "$file"; done

          assert_remote_tag() {
            local tag_object remote_commit remote_tree
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type')" = "tag"
            tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.object.type')" = "commit"
            remote_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.object.sha')"
            test "$remote_commit" = "$RELEASE_COMMIT"
            remote_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${remote_commit}" --jq '.tree.sha')"
            test "$remote_tree" = "$RELEASE_TREE"
          }

          assert_remote_tag

          release_touched=0
          replacement_ready=0
          release_id=""
          old_asset_count=0
          rollback_release() {
            status=$?
            if [[ "$status" -ne 0 && "$release_touched" -eq 1 ]]; then
              set +e
              if [[ -s .build/asset-swap.tsv ]]; then
                while IFS=$'\t' read -r official old_id new_id old_backup temporary; do
                  if [[ "$replacement_ready" -eq 1 ]]; then
                    [[ "$old_id" = "0" ]] || gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${old_id}" >/dev/null 2>&1
                  else
                    gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${new_id}" -f name="$temporary" >/dev/null 2>&1
                    gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${new_id}" >/dev/null 2>&1
                    [[ "$old_id" = "0" ]] || gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${old_id}" -f name="$official" >/dev/null 2>&1
                  fi
                done < .build/asset-swap.tsv
              fi
              if [[ "$replacement_ready" -eq 1 ]]; then
                gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                  -f tag_name="$RELEASE_TAG" -f name="SyncWatch同步观影 $RELEASE_TAG" \
                  -F "body=@${NOTES_FILE}" -F draft=false -F prerelease=false -f make_latest=true >/dev/null 2>&1
                echo "The replacement set passed readback; recovery published the verified new 8-asset set." >&2
              else
                old_name="$(node -p "require('./.build/pre-upload-release.json').name || 'SyncWatch同步观影 ' + process.env.RELEASE_TAG")"
                node -e 'require(`fs`).writeFileSync(`.build/previous-release-body.md`,require(`./.build/pre-upload-release.json`).body||``)'
                old_draft="$(node -p "String(require('./.build/pre-upload-release.json').draft===true)")"
                old_prerelease="$(node -p "String(require('./.build/pre-upload-release.json').prerelease===true)")"
                gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                  -f tag_name="$RELEASE_TAG" -f name="$old_name" -F "body=@.build/previous-release-body.md" \
                  -F draft="$old_draft" -F prerelease="$old_prerelease" $([[ "$old_draft" = false ]] && printf '%s' '-f make_latest=true') >/dev/null 2>&1
                echo "Atomic replacement failed before cutover; the previous assets and public Release state were restored." >&2
              fi
            fi
            exit "$status"
          }
          trap rollback_release EXIT

          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > .build/pre-upload-releases.json
          release_id="$(RELEASES_JSON=.build/pre-upload-releases.json node -e '
            const releases=require(`./${process.env.RELEASES_JSON}`);
            const matches=releases.filter((release)=>release.tag_name===process.env.RELEASE_TAG);
            if(matches.length>1)throw new Error(`Multiple Releases target ${process.env.RELEASE_TAG}.`);
            if(matches.length===1)process.stdout.write(String(matches[0].id));
          ')"
          if [[ -n "$release_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > .build/pre-upload-release.json
            RELEASE_JSON=.build/pre-upload-release.json node -e '
              const r=require(`./${process.env.RELEASE_JSON}`);
              if(!Array.isArray(r.assets) || ![0,6,8,10,11,26].includes(r.assets.length)) {
                throw new Error(`Release target changed after preparation; expected zero, partial legacy, or current 8 assets.`);
              }
            '
            old_asset_count="$(node -p "require('./.build/pre-upload-release.json').assets.length")"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f tag_name="$RELEASE_TAG" -F draft=true \
              -F prerelease=false > .build/pre-upload-release.json
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f name="SyncWatch同步观影 $RELEASE_TAG" \
              -F "body=@${NOTES_FILE}" \
              -F draft=true \
              -F prerelease=false > .build/pre-upload-release.json
            release_id="$(node -p "require('./.build/pre-upload-release.json').id")"
          fi
          test "$release_id" -gt 0
          release_touched=1

          mkdir -p .build/replacement-upload
          : > .build/replacement-map.tsv
          replacement_files=()
          for index in "${!files[@]}"; do
            official="${asset_names[$index]}"
            temporary="${official}.replacement-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            target=".build/replacement-upload/${temporary}"
            cp "${files[$index]}" "$target"
            replacement_files+=("$target")
            printf '%s\t%s\t%s\n' "$official" "$temporary" "${files[$index]}" >> .build/replacement-map.tsv
          done
          gh release upload "$RELEASE_TAG" "${replacement_files[@]}" --repo "$GITHUB_REPOSITORY"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > .build/uploaded-release.json

          RELEASE_JSON=.build/uploaded-release.json node -e '
            const fs=require(`fs`);
            const release=JSON.parse(fs.readFileSync(process.env.RELEASE_JSON,`utf8`));
            const sums=new Map(fs.readFileSync(`.build/SHA256SUMS-release-8.txt`,`utf8`).trim().split(/\r?\n/).map((line)=>{
              const match=/^([a-f0-9]{64})  (.+)$/.exec(line);
              if(!match)throw new Error(`Invalid local checksum row: ${line}`);
              return [match[2],match[1]];
            }));
            const mappings=fs.readFileSync(`.build/replacement-map.tsv`,`utf8`).trim().split(/\r?\n/).map((line)=>line.split(`\t`));
            if(mappings.length!==8 || sums.size!==8)throw new Error(`Replacement readback requires exactly 8 mapped assets.`);
            const rows=mappings.map(([official,temporary])=>{
              const asset=release.assets.find((entry)=>entry.name===temporary);
              const expected=sums.get(official);
              if(!asset || !expected || !Number.isSafeInteger(asset.id))throw new Error(`Missing replacement metadata for ${official}`);
              return `${expected}\t${official}\t${asset.id}`;
            });
            fs.writeFileSync(`.build/download-verification.tsv`,rows.join(`\n`)+`\n`);
          '
          test "$(wc -l < .build/download-verification.tsv | tr -d ' ')" = "8"
          while IFS=$'\t' read -r expected name asset_id; do
            actual=""
            for attempt in 1 2 3; do
              if actual="$(gh api \
                -H 'Accept: application/octet-stream' \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                | sha256sum | awk '{print $1}')"; then break; fi
              actual=""
            done
            test -n "$actual"
            if [[ "$actual" != "$expected" ]]; then
              echo "Downloaded SHA-256 mismatch for $name: expected $expected, got $actual" >&2
              exit 1
            fi
          done < .build/download-verification.tsv

          RELEASE_JSON=.build/uploaded-release.json node -e '
            const fs=require(`fs`);
            const release=require(`./${process.env.RELEASE_JSON}`);
            const mappings=fs.readFileSync(`.build/replacement-map.tsv`,`utf8`).trim().split(/\r?\n/).map((line)=>line.split(`\t`));
            const rows=mappings.map(([official,temporary])=>{
              const oldAsset=release.assets.find((entry)=>entry.name===official);
              const newAsset=release.assets.find((entry)=>entry.name===temporary);
              if(!newAsset)throw new Error(`Replacement asset missing: ${temporary}`);
              const oldBackup=`${official}.previous-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
              return `${official}\t${oldAsset?.id||0}\t${newAsset.id}\t${oldBackup}\t${temporary}`;
            });
            fs.writeFileSync(`.build/asset-swap.tsv`,rows.join(`\n`)+`\n`);
          '
          while IFS=$'\t' read -r official old_id new_id old_backup temporary; do
            [[ "$old_id" = "0" ]] || gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${old_id}" -f name="$old_backup" >/dev/null
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${new_id}" -f name="$official" >/dev/null
          done < .build/asset-swap.tsv

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > .build/replacement-ready-release.json
          RELEASE_JSON=.build/replacement-ready-release.json node -e '
            const fs=require(`fs`);
            const release=require(`./${process.env.RELEASE_JSON}`);
            const expected=new Set(fs.readFileSync(`.build/release-files-8.txt`,`utf8`).trim().split(/\r?\n/).map((line)=>line.replace(/^dist\//,``)));
            const filtered={...release,assets:release.assets.filter((asset)=>expected.has(asset.name))};
            if(filtered.assets.length!==8)throw new Error(`Cutover verification requires 8 official replacement names.`);
            fs.writeFileSync(`.build/replacement-official-release.json`,JSON.stringify(filtered));
          '
          node scripts/release-candidate-gate.js \
            --selection release --version "$RELEASE_VERSION" \
            --metadata .build/replacement-official-release.json \
            --expected-manifest .build/SHA256SUMS-release-8.txt
          replacement_ready=1
          while IFS=$'\t' read -r official old_id new_id old_backup temporary; do
            [[ "$old_id" = "0" ]] || gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${old_id}"
          done < .build/asset-swap.tsv

          # Refresh after deleting renamed legacy assets. The previous snapshot
          # still contains those IDs and would make the cleanup pass issue
          # harmless-but-failing DELETE requests against already removed assets.
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > .build/replacement-ready-release.json

          # Remove old or unselected assets only after the replacement set has passed remote hash validation.
          RELEASE_JSON=.build/replacement-ready-release.json node -e '
            const fs=require(`fs`);
            const release=require(`./${process.env.RELEASE_JSON}`);
            const expected=new Set(fs.readFileSync(`.build/release-files-8.txt`,`utf8`).trim().split(/\r?\n/).map((line)=>line.replace(/^dist\//,``)));
            for(const asset of release.assets) if(!expected.has(asset.name)) process.stdout.write(`${asset.id}\n`);
          ' > .build/legacy-asset-ids.txt
          while IFS= read -r legacy_id; do
            [[ -z "$legacy_id" ]] || gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${legacy_id}"
          done < .build/legacy-asset-ids.txt

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f tag_name="$RELEASE_TAG" \
            -f name="SyncWatch同步观影 $RELEASE_TAG" \
            -F "body=@${NOTES_FILE}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true > .build/published-release.json
          RELEASE_JSON=.build/published-release.json node -e '
            const r=require(`./${process.env.RELEASE_JSON}`);
            if(r.draft || r.prerelease || r.tag_name!==process.env.RELEASE_TAG || r.name!==`SyncWatch同步观影 ${process.env.RELEASE_TAG}`) {
              throw new Error(`Published Release identity/state mismatch.`);
            }
          '
          node scripts/release-candidate-gate.js \
            --selection release \
            --version "$RELEASE_VERSION" \
            --metadata .build/published-release.json \
            --expected-manifest .build/SHA256SUMS-release-8.txt

          assert_remote_tag

          latest=""
          for attempt in $(seq 1 12); do
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
            [[ "$latest" == "$RELEASE_TAG" ]] && break
            sleep 5
          done
          test "$latest" = "$RELEASE_TAG"
          node -e '
            const fs=require(`fs`);
            const release=JSON.parse(fs.readFileSync(`.build/published-release.json`,`utf8`));
            if(release.assets.length!==8)throw new Error(`Published Release requires exactly 8 assets.`);
            fs.writeFileSync(`.build/download-urls.txt`,release.assets.map((a)=>a.browser_download_url).join(`\n`)+`\n`);
          '
          test "$(wc -l < .build/download-urls.txt | tr -d ' ')" = "8"
          while IFS= read -r url; do
            curl --retry 3 --retry-all-errors -fsSIL --max-time 120 "$url" -o /dev/null
          done < .build/download-urls.txt

          curl --retry 3 --retry-all-errors -fL --max-time 900 \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.zip" \
            -o .build/github-source.zip
          unzip -t .build/github-source.zip
          unzip -p .build/github-source.zip "SyncWatch-${RELEASE_VERSION}/package.json" \
            | node -e 'let b="";process.stdin.on("data",c=>b+=c).on("end",()=>{if(JSON.parse(b).version!==process.env.RELEASE_VERSION)process.exit(1)})'
          rm .build/github-source.zip
          curl --retry 3 --retry-all-errors -fL --max-time 900 \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz" \
            -o .build/github-source.tar.gz
          tar -tzf .build/github-source.tar.gz > .build/github-source-tar-list.txt
          grep -qx "SyncWatch-${RELEASE_VERSION}/package.json" .build/github-source-tar-list.txt
          tar -xOzf .build/github-source.tar.gz "SyncWatch-${RELEASE_VERSION}/package.json" \
            | node -e 'let b="";process.stdin.on("data",c=>b+=c).on("end",()=>{if(JSON.parse(b).version!==process.env.RELEASE_VERSION)process.exit(1)})'
          rm .build/github-source.tar.gz
          release_touched=0
