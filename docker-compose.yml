services:
  syncwatch:
    build: .
    platform: linux/amd64
    container_name: syncwatch-server
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - "${SYNCWATCH_BIND_ADDRESS:-0.0.0.0}:${SYNCWATCH_PORT:-5000}:${SYNCWATCH_PORT:-5000}"
    environment:
      PORT: "${SYNCWATCH_PORT:-5000}"
      SYNCWATCH_PUBLIC_URL: "${SYNCWATCH_PUBLIC_URL:-}"
      SYNCWATCH_ALLOWED_HOSTS: "${SYNCWATCH_ALLOWED_HOSTS:-}"
      SYNCWATCH_TRUSTED_PROXIES: "${SYNCWATCH_TRUSTED_PROXIES:-}"
      SYNCWATCH_DATA_DIR: /app/SyncWatch同步观影-Data
    volumes:
      - ./SyncWatch同步观影-Data:/app/SyncWatch同步观影-Data

